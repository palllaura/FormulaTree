<!doctype html>
<html lang="et">
<head>
    <meta charset="utf-8"/>
    <title>FormulaTree</title>
    <style>
        body { font-family: system-ui, Avenir, Helvetica, Arial, sans-serif; padding: 24px; max-width: 500px; }
        h1 { font-size: large; }
        form { display: flex; flex-direction: column }
        label { font-size: small; display: block; margin-top: 12px; }
        .buttons { margin-top: 12px; margin-bottom: 12px; }
        .info { color: darkred; }
        .smallText { font-size: smaller }
    </style>
</head>

<body>

<h1>Palun sisestage enda kontaktandmed ning automargid, millest olete huvitatud</h1>

<form>
    <label for="nameInput">Ees- ja perekonnanimi:</label>
    <input id="nameInput" name="name" type="text" autocomplete="name"/>


    <label for="phoneInput">Kontakttelefon:</label>
    <input id="phoneInput" name="phone" type="text"/>


    <label for="carSelect">Automargid:</label>
    <select id="carSelect" multiple size="20" aria-label="carSelect"></select>

    <div>
        <label>
            <input id="licenseCheckbox" type="checkbox"/>
            Kas Teil on kehtiv juhiluba?
        </label>
    </div>

    <div class="buttons">
        <button id="submitButton" type="button" onclick="submitForm()">Salvesta</button>
    </div>

    <p id="messages" class="info"></p>
    <p class="smallText">Andmeid on võimalik muuta sama brauseri sessiooni jooksul.</p>

</form>

<script>
    let currentSubmissionId = null;

    function addOptions(options) {
        const select = document.getElementById('carSelect');

        options.forEach(option => {
            const el = document.createElement('option');
            el.value = option.key;

            const indent = '\u00A0'.repeat(option.level * 2);
            el.innerHTML = indent + option.name;

            select.appendChild(el);

            if (option.children && option.children.length > 0) {
                addOptions(option.children);
            }
        });
    }

    async function loadData() {
        const res = await fetch('http://localhost:8080/api/car-options');
        const data = await res.json();

        addOptions(data);
    }

    async function submitForm() {
        const select = document.getElementById('carSelect');
        const nameInput = document.getElementById('nameInput');
        const phoneInput = document.getElementById('phoneInput');
        const checkBox = document.getElementById('licenseCheckbox');
        const messagesEl = document.getElementById('messages');
        const button = document.getElementById('submitButton');

        button.disabled = true;
        messagesEl.innerHTML = "";

        const selectedOptions = [];
        for (const element of select.selectedOptions) {
            selectedOptions.push(element.value);
        }

        if (!nameInput.value.trim() || !phoneInput.value.trim() || selectedOptions.length < 1) {
            messagesEl.style.color = "darkred";
            messagesEl.innerText = "Palun täitke kõik väljad.";
            button.disabled = false;
            return;
        }

        const res = await fetch('http://localhost:8080/api/submission', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                name: nameInput.value.trim(),
                phone: phoneInput.value.trim(),
                carOptionKeys: selectedOptions,
                hasLicense: checkBox.checked,
                editSubmissionId: currentSubmissionId
            }),
        });
        const data = await res.json();

        if (res.ok && data.valid) {
            currentSubmissionId = data.id;
            messagesEl.style.color = "green";
            messagesEl.innerText = "Salvestamine õnnestus!";
        } else {
            messagesEl.style.color = "darkred";

            if (data.errors && data.errors.length > 0) {
                messagesEl.innerText = data.errors.join("<br>");
            } else {
                messagesEl.innerText = "Salvestamine ebaõnnestus, palun proovige uuesti";
            }
        }
        button.disabled = false;
    }

    window.onload = loadData;
</script>

</body>
</html>
